name: Build Rheum Revise Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Repair folder layout and configure Android Gradle plugin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets app/src/main/java/com/rheumrevise/app app/src/main/res

          # Recover files from an iPhone upload that flattened the ZIP hierarchy.
          for file in index.html app.js data.js style.css sw.js manifest.json; do
            if [ -f "$file" ]; then cp -f "$file" "app/src/main/assets/$file"; fi
          done
          if [ -d icons ]; then cp -r icons app/src/main/assets/; fi
          if [ -f MainActivity.java ]; then
            cp -f MainActivity.java app/src/main/java/com/rheumrevise/app/MainActivity.java
          fi
          if [ -f AndroidManifest.xml ]; then
            cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
          fi

          # Confirm source content is complete, especially the question database.
          for file in index.html app.js data.js style.css; do
            test -s "app/src/main/assets/$file" || { echo "ERROR: Missing $file in repository"; exit 1; }
          done
          test -s app/src/main/java/com/rheumrevise/app/MainActivity.java || { echo 'ERROR: Missing MainActivity.java'; exit 1; }
          test -s app/src/main/AndroidManifest.xml || { echo 'ERROR: Missing AndroidManifest.xml'; exit 1; }

          # The earlier AndroidManifest uses a mipmap icon; flattened uploads omit these resources.
          # Use an Android platform icon only if the original mipmap artwork is absent.
          if [ ! -f app/src/main/res/mipmap-mdpi/ic_launcher.png ]; then
            sed -i 's|@mipmap/ic_launcher|@android:drawable/sym_def_app_icon|g' app/src/main/AndroidManifest.xml
          fi

          # Do not depend on misplaced root Gradle files from a flattened upload.
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'RheumRevise'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.rheumrevise.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.rheumrevise.app'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.12.1'
              implementation 'androidx.activity:activity:1.9.3'
          }
          EOF
          echo "Question data size:" && wc -c app/src/main/assets/data.js
          echo "Android sources prepared."

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | head -1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RheumRevise-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
